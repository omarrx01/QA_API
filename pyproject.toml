[project]
name = "qa-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omarrx01", email = "omarhaitham04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
qa-api = "qa_api:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
